<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta a História — Arranjo de Figuras</title>
<style>
  :root {
    /* ===== CORES DA CLÍNICA ===== */
    --cor-primaria: #324d3e;        /* verde-escuro */
    --cor-primaria-escura: #2a3d28; /* texto */
    --cor-destaque: #87b27d;        /* verde-sage */
    --cor-fundo-1: #c9d8ba;         /* verde-claro */
    --cor-fundo-2: #f7f9f4;         /* off-white */
    --cor-texto: #2a3d28;           /* texto */
    --cor-texto-claro: #3d5238;     /* texto-claro */
    /* ============================= */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--cor-fundo-1) 0%, var(--cor-fundo-2) 100%);
    min-height: 100vh;
    color: var(--cor-texto);
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; }
  header.app-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .logo-img { height: 44px; width: auto; border-radius: 8px; }
  h1 { font-size: 1.5rem; }
  .subtitle { margin-bottom: 16px; opacity: .85; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: .95rem;
    background: var(--cor-destaque); color: #fff; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.88); color: var(--cor-texto); }
  .btn.danger { background: #ef476f; color: #fff; }
  .btn.small { padding: 6px 10px; font-size: .82rem; }
  .btn.green { background: var(--cor-primaria); color: #fff; }

  .save-status {
    font-size: .75rem; color: #1a7f4e; background: #d8f5e3;
    border-radius: 999px; padding: 3px 10px; font-weight: 600;
    opacity: 0; transition: opacity .3s; white-space: nowrap;
  }
  .loading { text-align: center; padding: 40px; font-size: 1.1rem; color: var(--cor-texto); }
  .loading small { display: block; margin-top: 8px; font-size: .8rem; opacity: .7; }

  /* Tela de login */
  .login-wrap { display: flex; justify-content: center; padding: 40px 10px; }
  .login-box {
    background: #fff; border-radius: 18px; padding: 36px 30px; width: 100%; max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,.15); text-align: center;
  }
  .login-box .logo-img { height: 80px; margin-bottom: 10px; }
  .login-box h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .login-box .login-sub { color: var(--cor-texto-claro); font-size: .9rem; margin-bottom: 18px; }
  .login-box input {
    width: 100%; padding: 12px; border: 2px solid var(--cor-fundo-1); border-radius: 10px;
    font-size: 1rem; margin-bottom: 10px; color: var(--cor-texto);
  }
  .login-box input:focus { outline: none; border-color: var(--cor-primaria); }
  .login-box .btn { width: 100%; padding: 12px; font-size: 1rem; }

  .access-denied {
    background: #fff; border-radius: 16px; padding: 40px 24px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.12); margin-top: 40px;
  }
  .access-denied h1 { margin: 12px 0 8px; }
  .access-denied p { margin-bottom: 8px; color: var(--cor-texto-claro); }

  .local-banner {
    background: #ffe8cc; color: #7a4a00; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 14px; font-size: .9rem; font-weight: 600;
  }

  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .menu-card {
    background: #fff; border-radius: 16px; padding: 22px 16px; text-align: center;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.12); transition: transform .15s, box-shadow .15s;
    border: 2px solid transparent;
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.16); border-color: var(--cor-primaria); }
  .menu-icon { font-size: 2.6rem; margin-bottom: 8px; }
  .menu-name { font-weight: 800; font-size: 1.15rem; }
  .menu-desc { color: var(--cor-texto-claro); font-size: .82rem; margin-top: 4px; }
  .menu-role-tag {
    display: inline-block; margin-top: 8px; font-size: .7rem; font-weight: 700;
    background: var(--cor-fundo-1); color: var(--cor-primaria); border-radius: 999px; padding: 2px 10px;
  }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: flex-start; }
  .tab {
    border: none; border-radius: 999px; padding: 8px 18px; font-weight: 700;
    background: rgba(255,255,255,.85); color: var(--cor-primaria); cursor: pointer; font-size: .95rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .tab.active { background: var(--cor-primaria); color: #fff; }

  .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .folder-card {
    background: #fff; border-radius: 14px; padding: 18px 12px; text-align: center;
    cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.12); transition: transform .15s;
  }
  .folder-card:hover { transform: translateY(-3px); }
  .folder-card.add { border: 2px dashed var(--cor-primaria); background: rgba(255,255,255,.6); }
  .folder-icon { font-size: 2.2rem; }
  .folder-name { font-weight: 800; font-size: 1.15rem; margin-top: 6px; }
  .folder-meta { color: var(--cor-texto-claro); font-size: .8rem; margin-top: 4px; }

  .word-banner {
    text-align: center; background: rgba(255,255,255,.88); border-radius: 12px;
    padding: 10px; margin-bottom: 14px; font-weight: 700; font-size: 1.05rem;
  }
  .word-banner.success { background: var(--cor-destaque); color: #fff; font-size: 1.25rem; }

  .card-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 10px 0 20px; }
  .card-wrap {
    position: relative; width: clamp(120px, 30vw, 170px);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .card-wrap.dragging { z-index: 50; }
  .card-wrap.dragging .card { box-shadow: 0 12px 26px rgba(0,0,0,.32); }
  .card {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .45s ease; cursor: grab;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .card-face.front { background: #fff; }
  .card-face.front img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder { font-size: 3rem; color: var(--cor-fundo-1); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .placeholder span { font-size: .8rem; color: var(--cor-texto-claro); }
  .card-face.back {
    background: linear-gradient(145deg, var(--cor-destaque), var(--cor-primaria));
    transform: rotateY(180deg); flex-direction: column; gap: 4px; color: #fff;
  }
  .back-order {
    position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.92);
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.05rem; color: var(--cor-primaria);
  }
  .back-letter { font-size: 5rem; font-weight: 900; line-height: 1; }
  .back-label { font-size: .72rem; opacity: .85; }
  .card-index-wrap { text-align: center; margin-top: 6px; }
  .card-index {
    font-weight: 700; color: var(--cor-texto); background: rgba(255,255,255,.85);
    border-radius: 999px; padding: 2px 12px; font-size: .9rem; display: inline-block;
  }
  .hint { text-align: center; font-size: .85rem; opacity: .8; margin-top: 6px; }

  .panel { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .panel h2 { font-size: 1.1rem; margin-bottom: 10px; }
  input[type=text], input[type=number], input[type=url], input[type=email], input[type=password], select {
    width: 100%; padding: 10px; border: 2px solid var(--cor-fundo-1); border-radius: 10px;
    font-size: 1rem; margin-bottom: 8px; color: var(--cor-texto); background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--cor-primaria); }
  input[type=file] { margin-bottom: 8px; font-size: .9rem; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form-row input, .form-row select { flex: 1; min-width: 110px; margin-bottom: 0; }

  .feedback { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; font-weight: 600; display: none; }
  .feedback.ok { background: #d8f5e3; color: #1a7f4e; display: block; }
  .feedback.err { background: #ffe0e6; color: #b0003a; display: block; }
  .feedback.info { background: var(--cor-fundo-1); color: var(--cor-primaria); display: block; }

  .folder-edit-row {
    display: flex; align-items: center; gap: 10px; background: var(--cor-fundo-2);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .fe-name { font-weight: 700; flex: 1; min-width: 120px; }
  .fe-meta { font-weight: 400; color: var(--cor-texto-claro); font-size: .8rem; margin-left: 6px; }
  .fe-actions { display: flex; gap: 6px; }

  .card-edit {
    display: flex; align-items: center; gap: 12px; background: var(--cor-fundo-2);
    border-radius: 12px; padding: 10px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .card-edit img, .card-edit .thumb {
    width: 54px; height: 70px; object-fit: cover; border-radius: 8px; background: var(--cor-fundo-1);
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  }
  .card-edit .info { flex: 1; min-width: 220px; }
  .card-edit .info .form-row input { margin-bottom: 0; }
  .file-btn {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: none; border-radius: 8px; padding: 8px 12px; font-size: .82rem; font-weight: 700;
    background: var(--cor-fundo-1); color: var(--cor-primaria); cursor: pointer;
  }
  .file-btn:hover { filter: brightness(.96); }
</style>
</head>
<body>
<div id="app"><div class="loading">Conectando ao servidor...<small>Se demorar, o app abre sozinho em modo local.</small></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://iksxnqnkjgjgwfoelwyc.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrc3hucW5ramdqZ3dmb2Vsd3ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDcyODEsImV4cCI6MjEwMzg4MzI4MX0.rPtwSg00uAyw1Cm_p8EZbw8ewIVQLQEGQWsnyQZGl_4';
  var LOGO_URL = 'https://i.imgur.com/isFp1jd.png';

  var DB_STORE_KEY = 'jogo_ordenar_local_v1';

  var sb = null;
  var useCloud = false;
  var cloudConfigured = false;
  var cloudReachable = false;
  var state = null;
  var view = 'login';
  var currentFolderId = null;
  var currentAbaId = null;
  var currentSubId = null;
  var drag = null;
  var myIp = null;
  var myRole = 'psicologo';
  var currentUser = null;
  var correctionMode = false;

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function seedImage(color) {
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='300' height='400' fill='" + color + "'/><circle cx='150' cy='175' r='58' fill='rgba(255,255,255,.35)'/><path d='M150 70 l18 46 50 5 -37 32 11 49 -42 -28 -42 28 11 -49 -37 -32 50 -5 z' fill='rgba(255,255,255,.55)'/></svg>";
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function defaultTestes() {
    return [{ id: 'aba-wais', nome: 'WAIS', submenus: [{ id: 'sub-arranjo', nome: 'Arranjo de Figuras', tipo: 'jogo' }] }];
  }

  function defaultData() {
    return {
      testes: defaultTestes(),
      folders: [{
        id: 'f-cap',
        name: 'CAP',
        cards: [
          { id: 'c-a', letter: 'A', order: 1, image: seedImage('#87b27d') },
          { id: 'c-c', letter: 'C', order: 2, image: seedImage('#324d3e') },
          { id: 'c-p', letter: 'P', order: 3, image: seedImage('#748b6f') }
        ]
      }]
    };
  }

  function ensureDefaults(s) {
    if (!s.testes || !Array.isArray(s.testes) || s.testes.length === 0) s.testes = defaultTestes();
    return s;
  }

  function saveLocal() {
    try { localStorage.setItem(DB_STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(DB_STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.folders)) return ensureDefaults(d);
      }
    } catch (e) {}
    return null;
  }

  function withTimeout(promise, ms, fallback) {
    return Promise.race([
      promise,
      new Promise(function (resolve) { setTimeout(function () { resolve(fallback); }, ms); })
    ]);
  }

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  async function saveState() {
    if (useCloud && sb) {
      var res = await withTimeout(
        sb.from('estado').upsert({ id: 'dados', dados: state, updated_at: new Date().toISOString() }),
        6000,
        { error: { code: 'TIMEOUT' } }
      );
      if (res.error) {
        console.error('Erro ao salvar no servidor:', res.error);
        saveLocal();
        showFeedback('Não foi possível salvar no servidor. Alterações salvas só neste aparelho.', false);
        return false;
      }
      flashSaved();
      return true;
    }
    saveLocal();
    flashSaved();
    return true;
  }

  async function loadState() {
    if (useCloud && sb) {
      var res = await withTimeout(
        sb.from('estado').select('dados').eq('id', 'dados').maybeSingle(),
        6000,
        { data: null, error: { code: 'TIMEOUT' } }
      );
      var data = res.data, error = res.error;
      if (error) {
        if (error.code === '42P01') {
          showFatal('A tabela "estado" ainda não existe. Rode o SQL de criação no Supabase (SQL Editor) antes de usar o app.');
          return;
        }
        console.error('Erro ao carregar estado:', error);
        state = loadLocal() || defaultData();
        return;
      }
      if (data && data.dados && Array.isArray(data.dados.folders)) {
        state = ensureDefaults(data.dados);
      } else {
        state = defaultData();
        await saveState();
      }
      return;
    }
    state = loadLocal() || defaultData();
  }

  async function checkAccess() {
    try {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 6000);
      var r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
      clearTimeout(t);
      var j = await r.json();
      myIp = j.ip;
      var res = await withTimeout(
        sb.from('acessos').select('*').eq('ip', myIp).maybeSingle(),
        6000,
        { data: null, error: { code: 'TIMEOUT' } }
      );
      var data = res.data, error = res.error;
      if (error) {
        if (error.code === '42P01') {
          showFatal('A tabela "acessos" ainda não existe. Rode o SQL de criação no Supabase (SQL Editor).');
          return false;
        }
        console.error('Erro ao consultar acessos:', error);
        return false;
      }
      cloudReachable = true;
      if (data) { myRole = data.papel; return true; }
      return false;
    } catch (e) {
      console.error('Falha ao verificar acesso:', e);
      return false;
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function currentFolder() {
    return state.folders.find(function (f) { return f.id === currentFolderId; });
  }

  function findSubmenu(subId) {
    for (var i = 0; i < state.testes.length; i++) {
      var found = state.testes[i].submenus.find(function (s) { return s.id === subId; });
      if (found) return found;
    }
    return null;
  }

  function showFeedback(msg, type) {
    var el = document.getElementById('feedback');
    if (!el) return;
    el.textContent = msg;
    el.className = 'feedback ' + (type === true ? 'ok' : type === false ? 'err' : 'info');
  }

  function showFatal(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="access-denied"><div style="font-size:3rem">⚠️</div><h1>Configuração pendente</h1><p>' + esc(msg) + '</p></div>';
  }

  function flashSaved() {
    var el = document.getElementById('saveStatus');
    if (!el) return;
    el.textContent = '💾 Salvo';
    el.style.opacity = '1';
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(function () { el.style.opacity = '0'; }, 1500);
  }

  function logoHTML(big) {
    return '<img class="logo-img" src="' + LOGO_URL + '" alt="Logo da Clínica" style="' + (big ? 'height:80px' : '') + '">';
  }

  /* ---------- telas ---------- */

  function render() {
    var app = document.getElementById('app');
    if (view === 'login') app.innerHTML = renderLogin();
    else if (view === 'primeiroAcesso') app.innerHTML = renderFirstAccess();
    else if (view === 'bloqueado') app.innerHTML = renderBloqueado();
    else if (view === 'menu') app.innerHTML = renderMenu();
    else if (view === 'testes') app.innerHTML = renderTestes();
    else if (view === 'jogar') app.innerHTML = renderJogar();
    else if (view === 'folder') { app.innerHTML = renderFolder(); updateWordStatus(); }
    else if (view === 'editor') app.innerHTML = renderEditor();
    else if (view === 'editFolder') app.innerHTML = renderEditFolder();
    else if (view === 'acessos') { app.innerHTML = renderAcessos(); if (myRole === 'admin' && useCloud) { renderAccessList(); renderUserList(); } }
    else if (view === 'aplicacoes') app.innerHTML = renderPlaceholder('📋 Aplicações', 'A tela de aplicações está em desenvolvimento.');
    else if (view === 'relatorio') app.innerHTML = renderPlaceholder('📊 Relatório', 'A tela de relatórios está em desenvolvimento.');
  }

  function renderLogin() {
    return '<div class="login-wrap">' +
      '<div class="login-box">' +
        logoHTML(true) +
        '<h1>📚 Conta a História</h1>' +
        '<div class="login-sub">Acesso restrito — Clínica</div>' +
        '<div id="feedback"></div>' +
        '<input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">' +
        '<input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password">' +
        '<button class="btn" onclick="doLogin()">Entrar</button>' +
      '</div>' +
    '</div>';
  }

  function renderFirstAccess() {
    return '<div class="login-wrap">' +
      '<div class="login-box">' +
        logoHTML(true) +
        '<h1>👋 Primeiro acesso</h1>' +
        '<div class="login-sub">Crie a conta de administrador da clínica</div>' +
        '<div id="feedback"></div>' +
        '<input type="text" id="faNome" placeholder="Seu nome">' +
        '<input type="email" id="faEmail" placeholder="E-mail">' +
        '<input type="password" id="faSenha" placeholder="Senha (mínimo 4 caracteres)">' +
        '<button class="btn" onclick="createFirstAdmin()">Criar administrador</button>' +
      '</div>' +
    '</div>';
  }

  function renderBloqueado() {
    var adminBtn = (currentUser && currentUser.papel === 'admin')
      ? '<button class="btn" style="margin-top:10px" onclick="liberarMeuIP()">🔓 Liberar este IP e entrar</button>'
      : '';
    return '<div class="access-denied">' +
      '<div style="font-size:3rem">🔒</div>' +
      '<h1>Acesso não liberado</h1>' +
      '<p>Seu login está correto, mas este aparelho (IP <strong>' + esc(myIp || 'desconhecido') + '</strong>) não está na lista de acessos permitidos.</p>' +
      '<p>Peça ao administrador para liberar este IP no painel de acessos.</p>' +
      adminBtn +
      '<div style="margin-top:12px"><button class="btn ghost" onclick="doLogout()">← Sair</button></div>' +
    '</div>';
  }

  function renderMenu() {
    var roleLabel = myRole === 'admin' ? 'Administrador' : 'Psicólogo(a)';
    var localBanner = (useCloud === false && cloudConfigured)
      ? '<div class="local-banner">⚠️ Sem conexão com o servidor. Modo local: os dados ficam salvos só neste aparelho.</div>'
      : '';
    var accessCard = (myRole === 'admin')
      ? '<div class="menu-card" onclick="goAcessos()">' +
          '<div class="menu-icon">🔐</div>' +
          '<div class="menu-name">Acessos</div>' +
          '<div class="menu-desc">Liberar IPs e usuários</div>' +
          '<div class="menu-role-tag">Admin</div>' +
        '</div>'
      : '';
    return '<header class="app-header">' +
        logoHTML(false) +
        '<h1>📚 Conta a História</h1>' +
        '<span id="saveStatus" class="save-status">💾 Salvo</span>' +
        '<span class="btn ghost small" style="cursor:default">👤 ' + roleLabel + '</span>' +
        '<button class="btn small ghost" onclick="doLogout()">Sair</button>' +

  /* ---------- login ---------- */

  async function doLogin() {
    var email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
    var senha = document.getElementById('loginSenha').value || '';
    if (!email || !senha) { showFeedback('Digite e-mail e senha.', false); return; }
    var res = await withTimeout(
      sb.from('usuarios').select('*').eq('email', email).maybeSingle(),
      6000,
      { data: null, error: { code: 'TIMEOUT' } }
    );
    if (res.error) {
      if (res.error.code === '42P01') {
        showFatal('A tabela "usuarios" ainda não existe. Rode o SQL de criação no Supabase (SQL Editor).');
        return;
      }
      if (res.error.code === 'TIMEOUT') {
        showFeedback('Servidor demorou para responder. Tente novamente.', false);
        return;
      }
      showFeedback('Erro ao consultar usuário: ' + res.error.message, false);
      return;
    }
    var user = res.data;
    if (!user) { showFeedback('E-mail ou senha incorretos.', false); return; }
    var hash = await sha256(senha);
    if (hash !== user.senha_hash) { showFeedback('E-mail ou senha incorretos.', false); return; }
    currentUser = user;
    myRole = user.papel;
    var allowed = await checkAccess();
    if (!cloudReachable) {
      useCloud = false;
      state = loadLocal() || defaultData();
      view = 'menu';
      render();
      return;
    }
    if (!allowed) {
      view = 'bloqueado';
      render();
      return;
    }
    await loadState();
    setupRealtime();
    view = 'menu';
    render();
  }

    }
    var hash = await sha256(senha);

      6000,
      { error: { code: 'TIMEOUT' } }

      showFeedback('Erro ao criar administrador: ' + res.error.message, false);

    showFeedback('Administrador criado! Faça login.', true);

  function compressImage(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          try {
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxDim / Math.max(w, h));
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (err) { reject(err); }
        };
        img.onerror = function () { reject(new Error('Arquivo não é uma imagem válida.')); };
        img.src = reader.result;
      };
      reader.onerror = function () { reject(new Error('Não foi possível ler o arquivo.')); };
      reader.readAsDataURL(file);
    });
  }

  async function addCard() {
    var f = currentFolder();
    if (!f) { showFeedback('Selecione uma pasta primeiro.', false); return; }
    var letter = (document.getElementById('ncLetter').value || '').trim().toUpperCase();
    var url = (document.getElementById('ncUrl').value || '').trim();
    var file = document.getElementById('ncFile').files[0];
    if (!letter) { showFeedback('Digite a letra da carta (ex.: A).', false); return; }
    try {
      var image = '';
      if (file) {
        showFeedback('Processando imagem...', null);
        image = await compressImage(file, 800, 0.8);
      } else {
        image = url;
      }
      f.cards.push({ id: uid(), letter: letter, order: f.cards.length + 1, image: image });
      var ok = await saveState();
      if (!ok) {
        f.cards.pop();
        showFeedback('Não foi possível salvar. Tente uma imagem menor.', false);
        return;
      }
      render();
      showFeedback('Carta adicionada e salva!', true);
    } catch (err) {
      showFeedback('Erro ao adicionar: ' + err.message, false);
    }
  }

  async function updateCardLetter(cardId, value) {
    var f = currentFolder();
    if (!f) return;
    var c = f.cards.find(function (x) { return x.id === cardId; });
    if (c) { c.letter = (value || '').trim().toUpperCase(); await saveState(); }
  }

  async function updateCardOrder(cardId, value) {
    var f = currentFolder();
    if (!f) return;
    var c = f.cards.find(function (x) { return x.id === cardId; });
    var n = parseInt(value, 10);
    if (c && !isNaN(n) && n > 0) { c.order = n; await saveState(); }
  }

  async function replaceCardImage(cardId, input) {
    var file = input.files[0];
    if (!file) return;
    var f = currentFolder();
    if (!f) return;
    var c = f.cards.find(function (x) { return x.id === cardId; });
    if (!c) return;
    try {
      showFeedback('Processando imagem...', null);
      c.image = await compressImage(file, 800, 0.8);
      await saveState();
      render();
      showFeedback('Imagem da carta atualizada!', true);
    } catch (err) {
      showFeedback('Erro ao trocar imagem: ' + err.message, false);
    }
  }

  async function replaceCardImageUrl(cardId, value) {
    var f = currentFolder();
    if (!f) return;
    var c = f.cards.find(function (x) { return x.id === cardId; });
    if (!c) return;
    var url = (value || '').trim();
    if (!url) return;
    c.image = url;
    await saveState();
    render();
    showFeedback('Imagem da carta atualizada!', true);

  async function moveCard(folderId, cardId, dir) {
    var f = state.folders.find(function (x) { return x.id === folderId; });
    if (!f) return;
    var i = f.cards.findIndex(function (c) { return c.id === cardId; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= f.cards.length) return;
    var tmp = f.cards[i];
    f.cards[i] = f.cards[j];
    f.cards[j] = tmp;
    await saveState();
    render();
  }

  /* ---------- jogo ---------- */

  async function shuffleCards() {
    var f = currentFolder();
    if (!f) return;
    correctionMode = false;
    for (var i = f.cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = f.cards[i];
      f.cards[i] = f.cards[j];
      f.cards[j] = tmp;
    }
    await saveState();
    render();
  }

  async function restoreOrder() {
    var f = currentFolder();
    if (!f) return;
    correctionMode = false;
    f.cards.sort(function (a, b) { return a.order - b.order; });
    await saveState();
    render();
  }

  function flipAll(showBack) {
    var cards = document.querySelectorAll('#cardRow .card');
    cards.forEach(function (c) {
      if (showBack) c.classList.add('flipped');
      else c.classList.remove('flipped');
    });
  }

  function toggleConclude() {
    var btn = document.getElementById('concludeBtn');
    if (correctionMode) {
      correctionMode = false;
      flipAll(false);
      if (btn) btn.innerHTML = '✅ Concluir';
    } else {
      correctionMode = true;
      flipAll(true);
      if (btn) btn.innerHTML = '↩️ Esconder';
    }
    updateWordStatus();
  }

  function updateWordStatus() {
    var f = currentFolder();
    if (!f) return;
    var banner = document.getElementById('wordBanner');
    if (!banner) return;
    var word = f.cards.map(function (c) { return c.letter; }).join('').toUpperCase();
    var target = f.name.toUpperCase();
    if (correctionMode) {
      if (word === target) {
        banner.innerHTML = '🎉 Você formou a palavra: <strong>' + esc(target) + '</strong>!';
        banner.className = 'word-banner success';
      } else {
        banner.innerHTML = 'Você formou: <strong>' + esc(word || '—') + '</strong>. Ainda não é a palavra certa — confira a posição original no verso de cada carta.';
        banner.className = 'word-banner';
      }
    } else {
      banner.innerHTML = 'Forme a palavra: <strong>' + esc(target) + '</strong>';
      banner.className = 'word-banner';
    }
  }

  /* ---------- arrastar e soltar ---------- */

  function startDrag(e, wrap) {
    if (view !== 'folder') return;
    if (correctionMode) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { id: wrap.dataset.id, startX: e.clientX, startY: e.clientY, moved: false };
    wrap.style.touchAction = 'none';
    wrap.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragUp);
    document.addEventListener('pointercancel', onDragUp);
  }

  function onDragMove(e) {
    if (!drag) return;
    var dx = e.clientX - drag.startX;
    var dy = e.clientY - drag.startY;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return;
    drag.moved = true;
    var row = document.getElementById('cardRow');
    if (!row) return;
    var wraps = Array.from(row.querySelectorAll('.card-wrap'));
    var el = wraps.find(function (w) { return w.dataset.id === drag.id; });
    if (!el) return;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.05)';
    el.style.zIndex = '50';
    var best = null, bestDist = Infinity;
    wraps.forEach(function (w) {
      if (w === el) return;
      var r = w.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var d = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (d < bestDist) { bestDist = d; best = w; }
    });
    if (best) {
      var curIdx = wraps.indexOf(el);
      var targetIdx = wraps.indexOf(best);
      if (targetIdx > curIdx) targetIdx -= 1;
      row.removeChild(el);
      var ref = row.children[targetIdx];
      if (ref) row.insertBefore(el, ref);
      else row.appendChild(el);
      var f = currentFolder();
      if (f) {
        f.cards = Array.from(row.querySelectorAll('.card-wrap'))
          .map(function (w) { return f.cards.find(function (c) { return c.id === w.dataset.id; }); })
          .filter(Boolean);
      }
      updateIndexLabels();
      updateWordStatus();
    }
  }

  function onDragUp() {
    if (!drag) return;
    var wasMoved = drag.moved;
    var id = drag.id;
    drag = null;
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragUp);
    document.removeEventListener('pointercancel', onDragUp);
    var el = document.querySelector('.card-wrap[data-id="' + id + '"]');
    if (el) {
      el.style.transform = '';
      el.style.zIndex = '';
      el.style.touchAction = '';
      el.classList.remove('dragging');
    }
    updateIndexLabels();
    updateWordStatus();
    if (wasMoved) saveState();
  }

  function updateIndexLabels() {
    var row = document.getElementById('cardRow');
    if (!row) return;
    Array.from(row.querySelectorAll('.card-wrap')).forEach(function (w, i) {
      var label = w.querySelector('.card-index');
      if (label) label.textContent = i + 1;
    });
  }

  /* ---------- usuários (admin) ---------- */

  async function addUsuario() {
    var nome = (document.getElementById('nuNome').value || '').trim();
    var email = (document.getElementById('nuEmail').value || '').trim().toLowerCase();
    var papel = document.getElementById('nuRole').value;
    if (!nome || !email) { showFeedback('Preencha nome e e-mail.', false); return; }
    var senha = prompt('Defina uma senha inicial para ' + email + ' (mínimo 4 caracteres):');
    if (senha === null || senha.length < 4) { showFeedback('Senha inválida (mínimo 4 caracteres).', false); return; }
    var hash = await sha256(senha);
    var res = await withTimeout(
      sb.from('usuarios').insert({ email: email, senha_hash: hash, papel: papel, nome: nome }),
      6000,
      { error: { code: 'TIMEOUT' } }
    );
    if (res.error) {
      if (res.error.code === '23505') { showFeedback('Este e-mail já está cadastrado.', false); return; }
      showFeedback('Erro ao criar usuário: ' + res.error.message, false);
      return;
    }
    showFeedback('Usuário criado!', true);
    document.getElementById('nuNome').value = '';
    document.getElementById('nuEmail').value = '';
    renderUserList();
  }
